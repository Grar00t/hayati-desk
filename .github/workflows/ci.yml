name: Build and test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and test with the repository warning gate
        run: dotnet test tests/HayatiDesk.Tests/HayatiDesk.Tests.csproj -c Release --nologo
